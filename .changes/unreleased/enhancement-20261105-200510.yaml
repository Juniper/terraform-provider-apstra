kind: enhancement
body: '`apstra_datacenter_virtual_network` resource: When `bindings` is omitted or `null`, the resource no longer manages bindings and leaves any that exist untouched. A configured bindings map remains authoritative and removes any bindings not listed in it. Support for empty map (`{}`) was introduced in this release and replaces the previous behavior of `null`.'
time: 2026-11-05T20:05:10.239068-05:00
