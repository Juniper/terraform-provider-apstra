name: Changie Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read

jobs:
  changie-checks:
    name: Changie PR checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0

      - name: Install changie
        shell: bash
        run: |
          go install github.com/miniscruff/changie@v1.25.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          which changie
          command -v changie
          changie --version

      - name: Run changie PR policy checks
        shell: bash
        run: |
          chmod +x scripts/changie_pr_check.sh
          chmod +x scripts/changie_normal_pr_check.sh
          chmod +x scripts/changie_release_pr_check.sh
          scripts/changie_pr_check.sh "origin/${{ github.base_ref }}"
