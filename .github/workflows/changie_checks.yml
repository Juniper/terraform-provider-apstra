name: Changie

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.9'

      - name: Install changie
        shell: bash
        run: |
          go install github.com/miniscruff/changie@8406ffac34697bd95d153550d0423e403fac9a90 #v1.25.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          command -v changie
          changie --version

      - name: Run changie PR policy checks
        shell: bash
        run: |
          scripts/changie_pr_check.sh "origin/${{ github.base_ref }}"
